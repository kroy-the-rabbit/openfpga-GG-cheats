<!--
  Game Gear core icon.

  A Game Gear cartridge with a tick on the label, the same idea as the
  sibling cores' icons: the cartridge says which system, the tick says
  cheats. The Pocket draws icons in greyscale, so colour only sets
  brightness. The body is mid grey, the label light, the tick dark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Game Gear cheats">
  <title>Game Gear cheats</title>

  <!-- cartridge body: a Game Gear cart is a tall rounded slab with a
       shallow grip on each side near the bottom -->
  <path d="M14 4h36a6 6 0 0 1 6 6v36l-4 4v12H12V50l-4-4V10a6 6 0 0 1 6-6z"
        fill="#5a6068"/>
  <!-- grip ridges -->
  <rect x="8" y="30" width="3" height="14" rx="1.5" fill="#3b4048"/>
  <rect x="53" y="30" width="3" height="14" rx="1.5" fill="#3b4048"/>

  <!-- label -->
  <rect x="15" y="10" width="34" height="34" rx="3" fill="#c8ccd2"/>

  <!-- the tick -->
  <path d="M22 28l7 7l14-15" fill="none" stroke="#1c1f24"
        stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- edge connector -->
  <rect x="18" y="56" width="28" height="4" fill="#23272d"/>
  <rect x="22" y="56" width="3" height="4" fill="#8a9098"/>
  <rect x="30" y="56" width="3" height="4" fill="#8a9098"/>
  <rect x="38" y="56" width="3" height="4" fill="#8a9098"/>
</svg>
