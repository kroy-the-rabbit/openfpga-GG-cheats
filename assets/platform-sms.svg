    <rect x="34" y="10" width="62" height="22" rx="2" fill="#000000"/>
    <rect x="36" y="12" width="58" height="18" rx="2" fill="#4a4a4a"/>
    <rect x="40" y="18" width="50" height="5" fill="#000000"/>
    <!-- the diagonal stripe across the front -->
    <polygon points="6,64 144,64 144,70 6,70" fill="#9a9a9a"/>
    <polygon points="98,58 144,58 144,64 106,64" fill="#c8c8c8"/>
    <!-- card slot on the front lip -->
    <rect x="16" y="76" width="44" height="4" fill="#000000"/>
    <!-- power and reset -->
    <rect x="112" y="74" width="12" height="7" rx="1" fill="#000000"/>
    <rect x="128" y="74" width="12" height="7" rx="1" fill="#000000"/>
    <!-- power light -->
    <rect x="102" y="76" width="4" height="3" fill="#c8c8c8"/>
  </g>
