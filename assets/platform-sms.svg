<!--
  Master System platform image, 521x165, in the same three-quarter view as the
  Game Gear one: console units through matrix(0.9 -0.45 0.9 0.45 70 95),
  thickness as the outline repeated one pixel lower, drawn first.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 521 165" width="521" height="165"
     shape-rendering="crispEdges">
  <rect width="521" height="165" fill="#ffffff"/>
  <g transform="translate(0,14)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,13)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,12)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,11)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,10)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,9)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,8)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,7)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,6)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,5)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,4)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,3)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,2)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="translate(0,1)"><g transform="matrix(0.9 -0.45 0.9 0.45 70 95)"><rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/><rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#202020"/></g></g>
  <g transform="matrix(0.9 -0.45 0.9 0.45 70 95)">
    <rect x="0" y="0" width="150" height="90" rx="4" fill="#000000"/>
    <rect x="1.5" y="1.5" width="147" height="87" rx="3" fill="#303030"/>
