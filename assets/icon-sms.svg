<!--
  Master System core icon.

  A Master System cartridge with a tick on the label, the same idea as
  icon-gg.svg: the cartridge says which system, the tick says cheats. The
  Master System cart is a wide, flat slab with one top corner cut off and a
  row of ridges along the top edge. The Pocket draws icons in greyscale, so
  colour only sets brightness.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Master System cheats">
  <title>Master System cheats</title>

  <!-- body: wide slab, chamfered top-right corner -->
  <path d="M8 6h36l14 14v38H8z" fill="#5a6068"/>
  <!-- the chamfer's shadow -->
  <path d="M44 6v14h14z" fill="#3b4048"/>

  <!-- ridges along the top edge -->
  <rect x="12" y="9" width="4" height="8" rx="1" fill="#3b4048"/>
  <rect x="19" y="9" width="4" height="8" rx="1" fill="#3b4048"/>
  <rect x="26" y="9" width="4" height="8" rx="1" fill="#3b4048"/>
  <rect x="33" y="9" width="4" height="8" rx="1" fill="#3b4048"/>

  <!-- label -->
  <rect x="12" y="22" width="40" height="28" rx="3" fill="#c8ccd2"/>

  <!-- the tick -->
  <path d="M20 36l7 7l16-14" fill="none" stroke="#1c1f24"
        stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- edge connector -->
  <rect x="14" y="58" width="36" height="4" fill="#23272d"/>
  <rect x="20" y="58" width="3" height="4" fill="#8a9098"/>
  <rect x="30" y="58" width="3" height="4" fill="#8a9098"/>
  <rect x="40" y="58" width="3" height="4" fill="#8a9098"/>
</svg>
